<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>벽사록 — 게임 데이터 위키</title>
<meta name="description" content="벽사 (K-Gothic Survivors) 무기 · 귀신 · 패시브 · 변형 · 노리개 · 특성 트리 · 신령 · 저승 데이터 위키.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="seal">辟</span><span class="brand-text">벽사록<small>辟邪錄 · 게임 데이터 위키</small></span></a>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="이름으로 찾기 — 사인검, 창귀, 백귀 쓸기…" autocomplete="off">
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <button id="lang-toggle" class="lang-toggle" type="button">English</button>
  <button id="menu-toggle" class="menu-toggle" aria-label="메뉴">☰</button>
</header>
<div class="band"></div>
<div class="layout">
  <nav id="side" class="side"></nav>
  <main id="main" class="main"><p class="loading">불러오는 중…</p></main>
</div>
<footer class="foot">
  <p><span id="contact-label">문의 · 제보</span>: <a href="mailto:ntaro117@gmail.com">ntaro117@gmail.com</a> · <span id="built"></span></p>
</footer>
<script>
// 언어 — 주소 ?lang= → 지난번 고른 것 → 브라우저 언어(한국어면 한국어, 아니면 영어). 그 언어의 데이터를 싣는다.
(function () {
  var q = new URLSearchParams(location.search).get("lang"), saved = null;
  try { saved = localStorage.getItem("wiki_lang"); } catch (e) { /* 저장이 막혀 있으면 넘어간다 */ }
  var lang = q || saved || ((navigator.language || "").toLowerCase().indexOf("ko") === 0 ? "ko" : "en");
  if (lang !== "en") lang = "ko";
  if (q) { try { localStorage.setItem("wiki_lang", lang); } catch (e) { /* 위와 같다 */ } }
  window.WIKI_LANG = lang;
  document.documentElement.lang = lang;
  document.write('<script src="' + (lang === "en" ? "wiki_data_en.js" : "wiki_data.js") + '"><\/script>');
})();
</script>
<script src="wiki_en.js"></script>
<script src="app.js"></script>
</body>
</html>
